name: Correct form color basis

on:
  push:
    branches:
      - fix/form-rating-color-cap-five

permissions:
  contents: write

jobs:
  correct-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/form-rating-color-cap-five

      - name: Apply corrected form color logic
        run: |
          echo '' | base64 -d > /tmp/correct_form_color.py
          python3 /tmp/correct_form_color.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Run color helper tests
        run: flutter test test/color_helper_test.dart

      - name: Analyze affected files
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/utils/color_helper.dart lib/screens/player_screen.dart

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Use average scale for form colors"
          git push

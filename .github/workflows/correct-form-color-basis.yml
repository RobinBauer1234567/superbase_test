name: Correct form color basis

on:
  push:
    branches:
      - fix/form-rating-color-cap-five

permissions:
  contents: write

jobs:
  correct-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/form-rating-color-cap-five

      - name: Apply corrected form color logic
        run: |
          python3 <<'PY'
          from pathlib import Path
          import base64

          def decode(value):
              return base64.b64decode(value).decode('utf-8')

          def replace_between(path, start_marker, end_marker, replacement):
              file_path = Path(path)
              text = file_path.read_text()
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f'{path}: start marker not found')
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f'{path}: end marker not found')
              file_path.write_text(text[:start] + replacement + text[end:])

          replace_between(
              'lib/utils/color_helper.dart',
              '/// Number of season rounds used to color the rolling form value.',
              'double getAveragePoints',
              decode('')
          )

          replace_between(
              'lib/screens/player_screen.dart',
              '                    // 3. Form: gleiche kumulative Farbformel wie Gesamtpunkte,',
              '                    return CustomScrollView',
              decode('')
          )

          test_path = Path('test/color_helper_test.dart')
          tests = test_path.read_text()
          start_marker = "  group('form rating color scaling', () {"
          start = tests.find(start_marker)
          end = tests.rfind('\n\n}')
          if start < 0 or end < start:
              raise SystemExit('test/color_helper_test.dart: form test group markers not found')
          tests = tests[:start] + decode('') + tests[end:]
          test_path.write_text(tests)

          workflow = Path('.github/workflows/correct-form-color-basis.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Run color helper tests
        run: flutter test test/color_helper_test.dart

      - name: Analyze affected files
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/utils/color_helper.dart lib/screens/player_screen.dart

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Use average scale for form colors"
          git push

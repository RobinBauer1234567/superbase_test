name: Scan average point usages

on:
  push:
    branches:
      - fix/unify-rating-colors
    paths:
      - .github/trigger-average-scan

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unify-rating-colors
          fetch-depth: 0
      - name: Scan average point usages
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# Average point usages'
            echo
            grep -RInE --include='*.dart' 'seasonAverage|matchCount|averagePlayerRating|DURCHSCHNITT|Durchschnitt|Punkteschnitt|punkteschnitt|average.*points|Average.*Points|AveragePoints' lib || true
          } > .github/average-point-usages.txt
      - name: Commit scan report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/average-point-usages.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: scan average point usages'
          git push origin HEAD:fix/unify-rating-colors

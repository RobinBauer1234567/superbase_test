name: Apply average rating formula

on:
  push:
    branches:
      - fix/unify-rating-colors
    paths:
      - .github/trigger-average-rating-patch

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unify-rating-colors
          fetch-depth: 0

      - name: Apply patch script
        run: python3 .github/scripts/apply_average_formula.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Format changed Dart files
        run: dart format lib/utils/color_helper.dart lib/screens/screenelements/match_screen/formations.dart lib/screens/leagues/league_team_screen.dart lib/screens/player_screen.dart test/color_helper_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Run color helper tests
        run: flutter test test/color_helper_test.dart

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'feat: apply appearance-based average point colors'
          git push origin HEAD:fix/unify-rating-colors

name: Run rating color patch

on:
  push:
    branches:
      - fix/unify-rating-colors
    paths:
      - .github/trigger-rating-color-patch

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unify-rating-colors
      - name: Prepare patch helper
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/apply_rating_color_patch.py')
          text = p.read_text()
          text = text.replace(
              "if found != expected:\n        raise SystemExit(",
              "if (count is None and found != expected) or (count is not None and found < expected):\n        raise SystemExit(",
          )
          text = text.replace(
              "p.write_text(text.replace(old, new))",
              "p.write_text(text.replace(old, new, expected) if count is not None else text.replace(old, new))",
          )
          p.write_text(text)
          PY
      - name: Apply patch
        run: python tools/apply_rating_color_patch.py
      - name: Remove temporary patch helpers
        run: |
          rm -f tools/apply_rating_color_patch.py
          rm -f .github/trigger-rating-color-patch
          rm -f .github/workflows/apply-rating-color-unification.yml
          rm -f .github/workflows/apply-rating-color-unification-v2.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: use season round count for aggregate rating colors"
          git push origin HEAD:fix/unify-rating-colors

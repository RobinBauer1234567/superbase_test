name: Apply form color formula

on:
  push:
    branches:
      - fix/form-rating-color-cap-five

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply targeted patch
        run: python .github/scripts/apply_form_color_formula.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Format helper and tests only
        run: dart format lib/utils/color_helper.dart test/color_helper_test.dart

      - name: Run color helper tests
        run: flutter test test/color_helper_test.dart

      - name: Analyze affected files
        run: >-
          flutter analyze --no-fatal-infos --no-fatal-warnings
          lib/utils/color_helper.dart
          lib/screens/player_screen.dart

      - name: Commit targeted changes
        run: |
          git checkout -- pubspec.lock
          git rm .github/scripts/apply_form_color_formula.py .github/workflows/apply-form-color-formula.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/utils/color_helper.dart lib/screens/player_screen.dart test/color_helper_test.dart
          git commit -m "Use capped aggregate scale for form colors"
          git push
